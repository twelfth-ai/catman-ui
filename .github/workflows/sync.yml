# Mirrors the components from https://ui.twelfth.ai/r, which Twelfth's main
# codebase publishes on every deploy. Hourly, or by hand from the Actions tab.
name: Sync from ui.twelfth.ai
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Commits through GitHub's API so they are signed and show as verified.
      - run: node scripts/sync.mjs --commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
